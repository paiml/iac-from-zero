version: "1.0"
name: lab-01-first-yaml
description: "Lab 1 reference solution: declare a workstation, apply twice, observe 0 changes"

params:
  user: de
  data_dir: /tmp/iac-from-zero-lab01

machines:
  localhost:
    hostname: localhost
    addr: 127.0.0.1

resources:
  data-dir:
    type: file
    machine: localhost
    path: "{{params.data_dir}}"
    state: directory
    mode: "0755"
    tags: [lab1, file]

  config-dir:
    type: file
    machine: localhost
    path: "{{params.data_dir}}/config"
    state: directory
    mode: "0755"
    depends_on: [data-dir]
    tags: [lab1, file]

  de-config:
    type: file
    machine: localhost
    path: "{{params.data_dir}}/config/de.yaml"
    state: file
    content: |
      # Generated by forjar — Lab 1 (declarative > imperative)
      data_dir: {{params.data_dir}}
      user: {{params.user}}
      profile: workstation
    mode: "0644"
    depends_on: [config-dir]
    tags: [lab1, file]

  readme-marker:
    type: file
    machine: localhost
    path: "{{params.data_dir}}/README.txt"
    state: file
    content: |
      This directory is managed by forjar.
      Do not edit by hand — run `forjar apply` to converge.
    mode: "0644"
    depends_on: [data-dir]
    tags: [lab1, file]
