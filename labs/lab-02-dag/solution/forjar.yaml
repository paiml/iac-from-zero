version: "1.0"
name: lab-02-dag
description: "Lab 2 reference: DAG-ordered file dependencies + depends_on contract"

params:
  base: /tmp/iac-from-zero-lab02
  user: de-cron-runner

machines:
  localhost:
    hostname: localhost
    addr: 127.0.0.1

# Five file resources arranged so the DAG resolver has work to do:
#   base-dir → data-dir → state-marker
#                       → log-dir   → logrotate-config
#
# Independent of declaration order, plan/apply must visit them in
# topological order. Alphabetical tie-breaking is part of forjar's claim
# C2 (deterministic execution).
resources:
  state-marker:
    type: file
    machine: localhost
    path: "{{params.base}}/data/state.json"
    state: file
    content: |
      {"managed_by":"forjar","lab":"lab-02-dag","user":"{{params.user}}"}
    mode: "0644"
    depends_on: [data-dir]
    tags: [lab2, marker]

  log-dir:
    type: file
    machine: localhost
    path: "{{params.base}}/log"
    state: directory
    mode: "0755"
    depends_on: [data-dir]
    tags: [lab2, log]

  data-dir:
    type: file
    machine: localhost
    path: "{{params.base}}/data"
    state: directory
    mode: "0755"
    depends_on: [base-dir]
    tags: [lab2, data]

  base-dir:
    type: file
    machine: localhost
    path: "{{params.base}}"
    state: directory
    mode: "0755"
    tags: [lab2, base]

  logrotate-config:
    type: file
    machine: localhost
    path: "{{params.base}}/log/logrotate.conf"
    state: file
    content: |
      # Generated by forjar — Lab 2 (declarative > imperative)
      {{params.base}}/log/*.log {
          daily
          rotate 14
          compress
          missingok
          notifempty
      }
    mode: "0644"
    depends_on: [log-dir]
    tags: [lab2, logrotate]
