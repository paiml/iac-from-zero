version: "1.0"
name: lab-03-drift
description: "Lab 3 reference: declare a stack, break it from outside, watch forjar detect + heal"

params:
  base: /tmp/iac-from-zero-lab03

machines:
  localhost:
    hostname: localhost
    addr: 127.0.0.1

# Three file resources. The drill is to apply, then `rm` one file
# from the filesystem outside forjar, then run `forjar drift` to see
# the missing-resource report, then `forjar apply` to reconverge.
# Claim C5 (content-addressed state) and C6 (atomic state persistence)
# are the operational claims this lab exercises.
resources:
  base-dir:
    type: file
    machine: localhost
    path: "{{params.base}}"
    state: directory
    mode: "0755"
    tags: [lab3, base]

  heartbeat:
    type: file
    machine: localhost
    path: "{{params.base}}/heartbeat.txt"
    state: file
    content: |
      # Generated by forjar — Lab 3
      # Delete this file outside forjar to simulate drift.
      heartbeat: ok
    mode: "0644"
    depends_on: [base-dir]
    tags: [lab3, heartbeat]

  cron-stub:
    type: file
    machine: localhost
    path: "{{params.base}}/cron-stub.conf"
    state: file
    content: |
      # Generated by forjar — Lab 3
      # In a real Coursera lab this would be /etc/cron.d/de-heartbeat,
      # writing every 5 min via the cron daemon. Here we keep it as a
      # plain file so the drift mechanic runs without sudo.
      */5 * * * * de touch {{params.base}}/heartbeat.txt
    mode: "0644"
    depends_on: [base-dir]
    tags: [lab3, cron]
