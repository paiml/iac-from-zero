# Canonical de-pipeline-host recipe.
#
# Module 5 / Lab 5 produces this recipe. The capstone reuses it.
# A recipe is a parameterized chunk of infrastructure with typed inputs
# and a `resources:` body. Composed by name from a parent forjar.yaml's
# `type: recipe` resource.
#
# The four inputs follow the playbook spec:
#   - postgres_version (string, required)
#   - etl_user         (string, required)
#   - data_dir         (string, default /data)
#   - cron_schedule    (string, default "0 2 * * *")

recipe:
  name: de-pipeline-host
  description: "Provision a Postgres-client + nightly-ETL host with logrotate"
  inputs:
    postgres_version:
      type: string
      description: "Major Postgres version this host is targeting (e.g. \"15\", \"16\")"
    etl_user:
      type: string
      description: "System user that owns /data and runs the ETL cron"
    data_dir:
      type: string
      description: "Root directory for ETL state; owned by etl_user"
      default: /data
    cron_schedule:
      type: string
      description: "Cron expression for the ETL job"
      default: "0 2 * * *"

resources:
  data-dir:
    type: file
    path: "{{inputs.data_dir}}"
    state: directory
    mode: "0755"
    tags: [pipeline, data]

  etl-dir:
    type: file
    path: "{{inputs.data_dir}}/etl"
    state: directory
    mode: "0755"
    depends_on: [data-dir]
    tags: [pipeline, data]

  config:
    type: file
    path: "{{inputs.data_dir}}/etl/pipeline.yaml"
    state: file
    mode: "0644"
    content: |
      # Generated by forjar — de-pipeline-host recipe
      postgres_version: "{{inputs.postgres_version}}"
      etl_user: "{{inputs.etl_user}}"
      data_dir: "{{inputs.data_dir}}"
      schedule: "{{inputs.cron_schedule}}"
    depends_on: [etl-dir]
    tags: [pipeline, config]

  cron-stub:
    type: file
    path: "{{inputs.data_dir}}/etl/cron.d-de-etl"
    state: file
    mode: "0644"
    content: |
      # Generated by forjar — de-pipeline-host recipe
      # In production this lives at /etc/cron.d/de-etl. The lab keeps it
      # as a plain file so it lands without sudo.
      {{inputs.cron_schedule}}  {{inputs.etl_user}}  /usr/local/bin/de-etl --run nightly
    depends_on: [etl-dir]
    tags: [pipeline, cron]

  logrotate:
    type: file
    path: "{{inputs.data_dir}}/etl/logrotate-de-etl.conf"
    state: file
    mode: "0644"
    content: |
      # Generated by forjar — de-pipeline-host recipe
      # In production this lives at /etc/logrotate.d/de-etl.
      {{inputs.data_dir}}/etl/*.log {
          daily
          rotate 14
          compress
          missingok
          notifempty
          create 0644 {{inputs.etl_user}} {{inputs.etl_user}}
      }
    depends_on: [etl-dir]
    tags: [pipeline, logrotate]
