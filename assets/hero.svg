<!-- GRID PROTOCOL MANIFEST
     Canvas: 1200x600 | text_elements: visible | role: img
     Zone 1 (0..400): OpenTofu HCL config + tfplan binary
     Zone 2 (400..800): forjar YAML config + BLAKE3 lock chain
     Zone 3 (800..1200): converged fleet (primary + canary hosts)
     Flow: HCL ↔ YAML  →  BLAKE3 lock  →  apply
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="hero-title">
  <title id="hero-title">IAC from Zero — OpenTofu HCL on the left, forjar YAML in the middle, BLAKE3-locked fleet on the right</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9d1a"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9966"/>
      <stop offset="100%" stop-color="#78dce8"/>
    </linearGradient>
    <linearGradient id="card-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- top accent rail -->
  <rect x="80" y="40" width="1040" height="4" rx="2" fill="url(#rust)"/>

  <!-- ============ Zone 1: OpenTofu / HCL ============ -->
  <g id="zone-opentofu">
    <rect x="40" y="80" width="340" height="440" rx="14" fill="url(#card-dark)" stroke="#7c3aed" stroke-width="3" stroke-opacity="0.85"/>
    <rect x="40" y="80" width="340" height="40" rx="14" fill="#7c3aed" fill-opacity="0.9"/>
    <text x="60" y="108" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#f5f5fa" letter-spacing="0.08em">OPENTOFU</text>
    <text x="350" y="108" font-family="'Cascadia Code', monospace" font-size="14" fill="#e0d4ff" text-anchor="end">.tf · HCL</text>

    <!-- code lines -->
    <text x="60" y="150" font-family="'Cascadia Code', monospace" font-size="14" fill="#a5b4fc">resource "null_resource"</text>
    <text x="60" y="170" font-family="'Cascadia Code', monospace" font-size="14" fill="#f5f5fa">  "web" {</text>
    <text x="60" y="190" font-family="'Cascadia Code', monospace" font-size="14" fill="#a5b4fc">  lifecycle {</text>
    <text x="60" y="210" font-family="'Cascadia Code', monospace" font-size="14" fill="#ffd166">    prevent_destroy = true</text>
    <text x="60" y="230" font-family="'Cascadia Code', monospace" font-size="14" fill="#a5b4fc">  }</text>
    <text x="60" y="250" font-family="'Cascadia Code', monospace" font-size="14" fill="#f5f5fa">}</text>

    <!-- arrow down to tfplan -->
    <line x1="210" y1="280" x2="210" y2="320" stroke="#a5b4fc" stroke-width="2"/>
    <polygon points="210,328 202,312 218,312" fill="#a5b4fc"/>

    <!-- tfplan binary blob -->
    <rect x="80" y="340" width="260" height="160" rx="10" fill="#0a0d12" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="100" y="370" font-family="'Cascadia Code', monospace" font-size="14" font-weight="700" fill="#a5b4fc">plan.tfplan</text>
    <text x="100" y="394" font-family="'Cascadia Code', monospace" font-size="11" fill="#7d8590">7f 8b 08 00 a9 e0 1c 67</text>
    <text x="100" y="412" font-family="'Cascadia Code', monospace" font-size="11" fill="#7d8590">02 ff 84 5d 6f 9b 30 14</text>
    <text x="100" y="430" font-family="'Cascadia Code', monospace" font-size="11" fill="#7d8590">fd cb d7 13 d7 e9 b6 49</text>
    <text x="100" y="448" font-family="'Cascadia Code', monospace" font-size="11" fill="#7d8590">53 c9 80 8a a8 28 1a 09</text>
    <text x="100" y="476" font-family="'Segoe UI', sans-serif" font-size="11" font-style="italic" fill="#7c3aed">opaque · binary · gzip</text>
  </g>

  <!-- ============ Zone 2: forjar / YAML ============ -->
  <g id="zone-forjar">
    <rect x="430" y="80" width="340" height="440" rx="14" fill="url(#card-dark)" stroke="#ff9d1a" stroke-width="3"/>
    <rect x="430" y="80" width="340" height="40" rx="14" fill="#ff9d1a" fill-opacity="0.92"/>
    <text x="450" y="108" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#161b22" letter-spacing="0.08em">FORJAR</text>
    <text x="740" y="108" font-family="'Cascadia Code', monospace" font-size="14" fill="#161b22" text-anchor="end">forjar.yaml</text>

    <!-- yaml lines -->
    <text x="450" y="150" font-family="'Cascadia Code', monospace" font-size="14" fill="#ff9d1a">resources:</text>
    <text x="450" y="170" font-family="'Cascadia Code', monospace" font-size="14" fill="#ffd166">  web:</text>
    <text x="450" y="190" font-family="'Cascadia Code', monospace" font-size="14" fill="#f5f5fa">    type: package</text>
    <text x="450" y="210" font-family="'Cascadia Code', monospace" font-size="14" fill="#f5f5fa">    name: nginx</text>
    <text x="450" y="230" font-family="'Cascadia Code', monospace" font-size="14" fill="#f5f5fa">    state: present</text>
    <text x="450" y="250" font-family="'Cascadia Code', monospace" font-size="14" fill="#7ee787">    # idempotent ✓</text>

    <!-- arrow down to lock -->
    <line x1="600" y1="280" x2="600" y2="320" stroke="#ff9d1a" stroke-width="2"/>
    <polygon points="600,328 592,312 608,312" fill="#ff9d1a"/>

    <!-- BLAKE3 lock chain -->
    <rect x="470" y="340" width="260" height="160" rx="10" fill="#0a0d12" stroke="#ff9d1a" stroke-width="2.5"/>
    <text x="490" y="370" font-family="'Cascadia Code', monospace" font-size="14" font-weight="700" fill="#ff9d1a">forjar.lock</text>
    <text x="490" y="394" font-family="'Cascadia Code', monospace" font-size="11" fill="#a9dc76">- name: web</text>
    <text x="490" y="412" font-family="'Cascadia Code', monospace" font-size="11" fill="#a9dc76">  hash: blake3:c4f3b1a8…</text>
    <text x="490" y="430" font-family="'Cascadia Code', monospace" font-size="11" fill="#a9dc76">- name: lifecycle</text>
    <text x="490" y="448" font-family="'Cascadia Code', monospace" font-size="11" fill="#a9dc76">  hash: blake3:9d2e7f04…</text>
    <text x="490" y="476" font-family="'Segoe UI', sans-serif" font-size="11" font-style="italic" fill="#ff9d1a">readable · YAML · git-tracked</text>
  </g>

  <!-- ============ Arrow between zones (HCL ↔ YAML) ============ -->
  <g id="vs-arrow">
    <line x1="395" y1="290" x2="425" y2="290" stroke="#f5f5fa" stroke-width="2"/>
    <polygon points="395,290 405,284 405,296" fill="#f5f5fa"/>
    <polygon points="425,290 415,284 415,296" fill="#f5f5fa"/>
    <rect x="386" y="262" width="48" height="22" rx="11" fill="#0d1117" stroke="#f5f5fa" stroke-width="1.5"/>
    <text x="410" y="278" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f5f5fa" text-anchor="middle">vs</text>
  </g>

  <!-- ============ Zone 3: converged fleet ============ -->
  <g id="zone-fleet">
    <rect x="820" y="80" width="340" height="440" rx="14" fill="url(#card-dark)" stroke="#36b37e" stroke-width="3"/>
    <rect x="820" y="80" width="340" height="40" rx="14" fill="#36b37e" fill-opacity="0.92"/>
    <text x="840" y="108" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0e0e1a" letter-spacing="0.08em">APPLIED</text>
    <text x="1140" y="108" font-family="'Cascadia Code', monospace" font-size="14" fill="#0e0e1a" text-anchor="end">canary fleet</text>

    <!-- primary host -->
    <rect x="850" y="150" width="280" height="100" rx="10" fill="#0a0d12" stroke="#36b37e" stroke-width="2.5"/>
    <circle cx="880" cy="200" r="18" fill="#36b37e" fill-opacity="0.9"/>
    <text x="880" y="207" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0e0e1a" text-anchor="middle">P</text>
    <text x="910" y="186" font-family="'Cascadia Code', monospace" font-size="14" font-weight="700" fill="#7ee787">primary</text>
    <text x="910" y="208" font-family="'Cascadia Code', monospace" font-size="12" fill="#a0a8c0">10.0.0.10</text>
    <text x="910" y="226" font-family="'Cascadia Code', monospace" font-size="12" fill="#a0a8c0">nginx · healthy</text>
    <rect x="1080" y="180" width="36" height="20" rx="6" fill="#36b37e" fill-opacity="0.4" stroke="#36b37e" stroke-width="1.5"/>
    <text x="1098" y="195" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#7ee787" text-anchor="middle">✓</text>

    <!-- canary host -->
    <rect x="850" y="270" width="280" height="100" rx="10" fill="#0a0d12" stroke="#ffd166" stroke-width="2.5"/>
    <circle cx="880" cy="320" r="18" fill="#ffd166" fill-opacity="0.9"/>
    <text x="880" y="327" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0e0e1a" text-anchor="middle">C</text>
    <text x="910" y="306" font-family="'Cascadia Code', monospace" font-size="14" font-weight="700" fill="#ffd166">canary</text>
    <text x="910" y="328" font-family="'Cascadia Code', monospace" font-size="12" fill="#a0a8c0">10.0.0.11</text>
    <text x="910" y="346" font-family="'Cascadia Code', monospace" font-size="12" fill="#a0a8c0">nginx · healthy</text>
    <rect x="1080" y="300" width="36" height="20" rx="6" fill="#ffd166" fill-opacity="0.4" stroke="#ffd166" stroke-width="1.5"/>
    <text x="1098" y="315" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffd166" text-anchor="middle">✓</text>

    <!-- 10 claims -->
    <rect x="850" y="390" width="280" height="110" rx="10" fill="#0a0d12" stroke="#36b37e" stroke-width="2"/>
    <text x="870" y="416" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#36b37e" letter-spacing="0.06em">10 FORJAR CLAIMS</text>
    <text x="870" y="438" font-family="'Cascadia Code', monospace" font-size="12" fill="#7ee787">C1 deterministic    ✓</text>
    <text x="870" y="456" font-family="'Cascadia Code', monospace" font-size="12" fill="#7ee787">C4 idempotent       ✓</text>
    <text x="870" y="474" font-family="'Cascadia Code', monospace" font-size="12" fill="#7ee787">C7 cycle-free DAG   ✓</text>
    <text x="1040" y="438" font-family="'Cascadia Code', monospace" font-size="12" fill="#7ee787">… 7 more</text>
    <text x="870" y="495" font-family="'Segoe UI', sans-serif" font-size="11" font-style="italic" fill="#36b37e">live-asserted on every apply</text>
  </g>

  <!-- ============ Bottom caption ============ -->
  <text x="600" y="565" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#a0a8c0" text-anchor="middle">10 OpenTofu features &#8226; 10 forjar equivalents &#8226; 12 runnable demos</text>
</svg>
