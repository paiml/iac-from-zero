<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
<!-- HERO — paiml/iac-from-zero README banner.
     Visual story: forjar.yaml → DAG (plan/apply) → BLAKE3 lock store.
     Right-edge pillar lists the five labs (one per module). Same
     oxide-premium chassis as postgres-from-zero / duckdb-from-zero. -->

<defs>
  <style>
    .h { font-family: 'Segoe UI', 'Helvetica Neue', sans-serif; }
    .m { font-family: 'Cascadia Code', 'Fira Code', monospace; }
    .label { font-family: 'Segoe UI', sans-serif; letter-spacing: 0.12em; }
  </style>

  <radialGradient id="bg" cx="50%" cy="40%" r="80%">
    <stop offset="0%" stop-color="#1a2540"/>
    <stop offset="100%" stop-color="#0e1726"/>
  </radialGradient>
  <linearGradient id="accent-strip" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff8a4c" stop-opacity="0.85"/>
    <stop offset="50%" stop-color="#00b8d9" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#9c84ff" stop-opacity="0.85"/>
  </linearGradient>
  <radialGradient id="zone-yaml" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff8a4c" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#ff8a4c" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="zone-dag" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#36b37e" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#36b37e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="zone-lock" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#9c84ff" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#9c84ff" stop-opacity="0"/>
  </radialGradient>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 7 L 0 14 Z" fill="#00b8d9"/>
  </marker>
</defs>

<rect width="1280" height="480" fill="url(#bg)"/>

<!-- Top accent strip -->
<rect x="0" y="0" width="1280" height="6" fill="url(#accent-strip)"/>

<!-- Title block — left third -->
<g class="h">
  <text x="60" y="92" font-size="44" font-weight="700" fill="#eeeeee">IaC from Zero</text>
  <text x="60" y="132" font-size="20" fill="#a5d6ff" letter-spacing="0.05em">Rust for Data Engineering · forjar · BLAKE3 lock · Capstone-ready</text>
  <text x="60" y="162" font-size="14" fill="#ff8a4c" letter-spacing="0.10em" font-weight="700">5 LABS · 10 FALSIFIABLE CLAIMS · 1 RECIPE · 1 CAPSTONE</text>
</g>

<!-- Stop 1: forjar.yaml at x=240, y=300 -->
<circle cx="240" cy="300" r="120" fill="url(#zone-yaml)"/>
<g id="stop-yaml">
  <rect x="160" y="240" width="160" height="120" rx="8" fill="#0e1726" stroke="#ff8a4c" stroke-width="3"/>
  <rect x="160" y="240" width="160" height="32" rx="8" fill="#1a1d23" stroke="#ff8a4c" stroke-width="2.5"/>
  <text x="178" y="262" class="m" font-size="13" font-weight="700" fill="#ffb380">YAML</text>
  <text x="240" y="295" text-anchor="middle" class="m" font-size="14" font-weight="700" fill="#ffb380">forjar.yaml</text>
  <text x="240" y="318" text-anchor="middle" class="m" font-size="14" fill="#ffb380">+ recipes/</text>
  <text x="240" y="356" text-anchor="middle" class="label" font-size="14" font-weight="700" fill="#ff8a4c">DECLARE</text>
</g>

<!-- Stop 2: DAG plan/apply at x=600, y=300 -->
<circle cx="600" cy="300" r="120" fill="url(#zone-dag)"/>
<g id="stop-dag">
  <rect x="520" y="240" width="160" height="120" rx="8" fill="#0e1726" stroke="#36b37e" stroke-width="3"/>
  <rect x="520" y="240" width="160" height="32" rx="8" fill="#1a1d23" stroke="#36b37e" stroke-width="2.5"/>
  <text x="538" y="262" class="m" font-size="13" font-weight="700" fill="#7ee787">DAG</text>
  <text x="600" y="295" text-anchor="middle" class="m" font-size="14" font-weight="700" fill="#7ee787">plan + apply</text>
  <text x="600" y="318" text-anchor="middle" class="m" font-size="14" fill="#7ee787">drift detect</text>
  <text x="600" y="356" text-anchor="middle" class="label" font-size="14" font-weight="700" fill="#36b37e">CONVERGE</text>
</g>

<!-- Stop 3: BLAKE3 lock at x=960, y=300 -->
<circle cx="960" cy="300" r="120" fill="url(#zone-lock)"/>
<g id="stop-lock">
  <rect x="880" y="240" width="160" height="120" rx="8" fill="#0e1726" stroke="#9c84ff" stroke-width="3.5"/>
  <rect x="880" y="240" width="160" height="32" rx="8" fill="#1a1d23" stroke="#9c84ff" stroke-width="2.5"/>
  <text x="898" y="262" class="m" font-size="13" font-weight="700" fill="#9c84ff">LOCK</text>
  <text x="960" y="295" text-anchor="middle" class="m" font-size="14" font-weight="700" fill="#b8acff">forjar.lock</text>
  <text x="960" y="318" text-anchor="middle" class="m" font-size="14" fill="#b8acff">BLAKE3 hash</text>
  <text x="960" y="356" text-anchor="middle" class="label" font-size="14" font-weight="700" fill="#9c84ff">PIN</text>
</g>

<!-- Arrows between stops -->
<line x1="330" y1="300" x2="510" y2="300" stroke="#00b8d9" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="690" y1="300" x2="870" y2="300" stroke="#00b8d9" stroke-width="3" marker-end="url(#arrow)"/>

<!-- Five-labs pillar — right edge -->
<g id="labs-pillar">
  <rect x="1100" y="200" width="140" height="200" rx="10" fill="#0e1726" stroke="#7ee787" stroke-width="3"/>
  <rect x="1100" y="200" width="140" height="36" rx="10" fill="#1f4d3a" stroke="#7ee787" stroke-width="2"/>
  <text x="1170" y="224" text-anchor="middle" class="h" font-size="15" font-weight="700" fill="#eeeeee">5 labs</text>
  <line x1="1110" y1="252" x2="1230" y2="252" stroke="#7ee787" stroke-width="1.5" opacity="0.5"/>
  <text x="1118" y="276" class="m" font-size="13" fill="#a8f0c5">first-yaml</text>
  <text x="1118" y="298" class="m" font-size="13" fill="#a8f0c5">dag</text>
  <text x="1118" y="320" class="m" font-size="13" fill="#a8f0c5">drift</text>
  <text x="1118" y="342" class="m" font-size="13" fill="#a8f0c5">plan-pin</text>
  <text x="1118" y="364" class="m" font-size="13" fill="#a8f0c5">recipes</text>
  <text x="1170" y="390" text-anchor="middle" class="label" font-size="11" fill="#7ee787">one per module</text>
</g>

<!-- Bottom claims strip -->
<g id="claims-strip">
  <rect x="60" y="420" width="1160" height="36" rx="6" fill="#161b22" stroke="#7ee787" stroke-width="2" fill-opacity="0.85"/>
  <text x="80" y="444" class="h" font-size="14" font-weight="700" fill="#7ee787">claims:</text>
  <text x="160" y="444" class="m" font-size="14" fill="#eeeeee">C1 deterministic hash · C3 idempotency · C5 content-addressed state · C7 typed inputs · C10 jidoka stop</text>
</g>

<!-- GRID PROTOCOL MANIFEST
  template: HERO (README banner)
  canvas: 1280x480
  zones: yaml@(240,300) | dag@(600,300) | lock@(960,300) | labs-pillar@(1100..1240, 200..400)
  text_elements: 21
  palette_colors: [#0e1726, #1a2540, #1a1d23, #161b22, #1f4d3a, #ff8a4c, #ffb380, #a5d6ff, #36b37e, #7ee787, #a8f0c5, #9c84ff, #b8acff, #00b8d9, #eeeeee]
  bounds_check: all elements within 0,0 → 1280,480
-->
</svg>
